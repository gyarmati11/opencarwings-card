name: Release

# Automatikus kiadás: ha a dist/opencarwings-card.js-ben megváltozik a CARD_VERSION,
# létrehozza a vX.Y.Z taget és a GitHub kiadást (a HACS ezt mutatja verzióként).
on:
  push:
    branches: [main]
    paths: [dist/opencarwings-card.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          VER=$(grep -oP 'CARD_VERSION = "\K[0-9.]+' dist/opencarwings-card.js)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Create release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/opencarwings-card.js
